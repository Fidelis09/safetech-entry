# ============================================================
# CONFIGURAÇÃO DOS TESTES (pytest)
# ============================================================
#
# Para rodar todos os testes, na pasta do projeto:
#
#     python -m pytest
#
# testpaths  -> onde ficam os testes
# pythonpath -> deixa "import safetech" funcionar sem instalar nada
# -q         -> saída resumida (um ponto por teste que passou)
# ============================================================

[pytest]
testpaths = testes
pythonpath = .
addopts = -q
